services:
  postgres:
    image: postgres:16-alpine
    container_name: faq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: faq_chatbot
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d faq_chatbot']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: faq_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '3333'
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/faq_chatbot?schema=public
      CORS_ORIGIN: http://localhost:5173,http://localhost:8080
      FAQ_SIMILARITY_THRESHOLD: '0.30'
      FAQ_SUGGESTION_THRESHOLD: '0.15'
      FAQ_MAX_ANSWER_CANDIDATES: '3'
      CHAT_RATE_LIMIT_MAX: '30'
      CHAT_RATE_LIMIT_WINDOW_MS: '60000'
      LOG_LEVEL: info
      RUN_MIGRATIONS_ON_START: 'true'
      SEED_ON_START: 'true'
    ports:
      - '3333:3333'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --quiet --tries=1 --spider http://127.0.0.1:3333/api/v1/health || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: faq_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '8080:80'

volumes:
  postgres-data:
